<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Replacer</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            margin: auto;
            transition: 0.3s;
        }
        .container:hover {
            transform: scale(1.02);
        }
        .card {
            background: #fff;
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            box-shadow: 0px 3px 10px rgba(0, 0, 0, 0.1);
            text-align: left;
            position: relative;
        }
        .copy-btn {
            display: block;
            margin: 10px auto 0;
            padding: 8px 12px;
            font-size: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }
        .copy-btn:hover {
            background-color: #0056b3;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            margin: 0;
            color: #333;
        }
        input {
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 6px;
            width: 80%;
            margin-bottom: 12px;
            transition: 0.3s;
        }
        input:focus {
            border-color: #007bff;
            outline: none;
        }
        button {
            padding: 12px 18px;
            font-size: 16px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
            transition: 0.3s;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <p id="originalText">A tiny cat, about the size of a human finger, is shown in extreme close-up while standing on a human finger.</p>
            <button class="copy-btn" onclick="copyText('originalText')">Copy</button>
        </div>
        
        <label for="newWords">Enter words to replace "cat" (separated by commas): </label>
        <input type="text" id="newWords" placeholder="Enter new words">
        <button onclick="replaceWords()">Replace</button>
        
        <div id="modifiedTextContainer"></div>
    </div>
    
    <script>
        function replaceWords() {
            let newWords = document.getElementById("newWords").value.split(",").map(word => word.trim());
            let originalText = document.getElementById("originalText").innerText;
            let modifiedTextContainer = document.getElementById("modifiedTextContainer");
            
            modifiedTextContainer.innerHTML = "";
            
            newWords.forEach((word, index) => {
                let newText = originalText.replace(/\bcat\b/g, word);
                let card = document.createElement("div");
                card.classList.add("card");
                
                let paragraph = document.createElement("p");
                let paragraphId = `modifiedText${index}`;
                paragraph.id = paragraphId;
                paragraph.innerText = newText;
                
                let copyButton = document.createElement("button");
                copyButton.innerText = "Copy";
                copyButton.classList.add("copy-btn");
                copyButton.onclick = function() {
                    copyText(paragraphId);
                };
                
                card.appendChild(paragraph);
                card.appendChild(copyButton);
                modifiedTextContainer.appendChild(card);
            });
        }

        function copyText(elementId) {
            let text = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(text).then(() => {
                Swal.fire({
                    icon: 'success',
                    title: 'Copied!',
                    text: 'Text has been copied to clipboard.',
                    timer: 2000,
                    showConfirmButton: false
                });
            }).catch(err => {
                console.error("Error copying text: ", err);
            });
        }
    </script>
</body>
</html>
