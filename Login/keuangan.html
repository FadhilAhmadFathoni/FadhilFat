<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catat Pengeluaran | Database</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center pt-8 pb-12 px-4 font-sans">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="p-6 pb-2 text-center">
            <h1 class="text-2xl font-bold text-gray-800 tracking-tight">Catat Pengeluaran</h1>
            <p class="text-gray-500 text-sm">Monitoring uang keluar harian</p>
        </div>

        <form id="expenseForm" class="p-6 space-y-5">
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Tanggal</label>
                <input type="date" id="tanggal" required class="w-full h-12 px-4 rounded-2xl bg-gray-50 border-transparent focus:bg-white focus:ring-2 focus:ring-red-500 outline-none transition-all">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Kategori</label>
                <div class="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
                    <label class="flex-shrink-0">
                        <input type="radio" name="kategori" value="Kebutuhan" class="hidden peer" checked>
                        <span class="px-5 py-2 rounded-full border border-gray-200 text-sm peer-checked:bg-red-500 peer-checked:text-white peer-checked:border-red-500 inline-block cursor-pointer transition-all">Kebutuhan</span>
                    </label>
                    <label class="flex-shrink-0">
                        <input type="radio" name="kategori" value="Keinginan" class="hidden peer">
                        <span class="px-5 py-2 rounded-full border border-gray-200 text-sm peer-checked:bg-red-500 peer-checked:text-white peer-checked:border-red-500 inline-block cursor-pointer transition-all">Keinginan</span>
                    </label>
                    <label class="flex-shrink-0">
                        <input type="radio" name="kategori" value="Jajan" class="hidden peer">
                        <span class="px-5 py-2 rounded-full border border-gray-200 text-sm peer-checked:bg-red-500 peer-checked:text-white peer-checked:border-red-500 inline-block cursor-pointer transition-all">Jajan</span>
                    </label>
                    <label class="flex-shrink-0">
                        <input type="radio" name="kategori" value="Lainnya" class="hidden peer">
                        <span class="px-5 py-2 rounded-full border border-gray-200 text-sm peer-checked:bg-red-500 peer-checked:text-white peer-checked:border-red-500 inline-block cursor-pointer transition-all">Lainnya</span>
                    </label>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Keperluan</label>
                <input type="text" id="keterangan" placeholder="Beli apa?" required class="w-full h-12 px-4 rounded-2xl bg-gray-50 border-transparent focus:bg-white focus:ring-2 focus:ring-red-500 outline-none transition-all">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Nominal (Rp)</label>
                <input type="number" id="jumlah" placeholder="0" required class="w-full h-12 px-4 rounded-2xl bg-gray-50 border-transparent focus:bg-white focus:ring-2 focus:ring-red-500 outline-none transition-all font-bold text-red-600 text-lg">
            </div>

            <button type="submit" id="submitBtn" class="w-full h-14 bg-gray-900 text-white font-bold rounded-2xl hover:bg-black active:scale-95 transition-all mt-4">Simpan Pengeluaran</button>
        </form>

        <div id="status" class="px-6 pb-4 text-center text-sm font-medium hidden"></div>

        <div class="px-4 pb-8 border-t border-gray-50 pt-6">
            <div class="flex justify-between items-center mb-4 px-2">
                <h2 class="text-sm font-bold text-gray-800 uppercase tracking-widest">Database Spreadsheet</h2>
                <button onclick="loadDatabase()" class="bg-blue-50 text-blue-600 px-3 py-1 rounded-lg text-[10px] font-bold hover:bg-blue-100 transition">
                    REFRESH DATA
                </button>
            </div>
            
            <div class="overflow-x-auto rounded-xl border border-gray-100 bg-gray-50/50">
                <table class="w-full text-left text-[11px]">
                    <thead>
                        <tr class="bg-gray-100 text-gray-500 uppercase">
                            <th class="p-3 font-bold">Tgl</th>
                            <th class="p-3 font-bold">Kategori</th>
                            <th class="p-3 font-bold">Ket</th>
                            <th class="p-3 font-bold text-right">Jumlah</th>
                        </tr>
                    </thead>
                    <tbody id="databaseBody" class="divide-y divide-gray-100 bg-white">
                        </tbody>
                </table>
            </div>
            <p id="totalData" class="mt-3 text-[10px] text-gray-400 text-right pr-2"></p>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzTsxj9tjPvNf-d08PZvGx3D0Xi6LzVXle0zBrwkKvRe0X2vlzDopc_qR1bkaHbqnkA/exec';
        
        const form = document.getElementById('expenseForm');
        const statusText = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');
        const databaseBody = document.getElementById('databaseBody');
        const totalDataText = document.getElementById('totalData');

        document.getElementById('tanggal').valueAsDate = new Date();

        // FUNGSI LOAD DATABASE (GET)
        function loadDatabase() {
            databaseBody.innerHTML = '<tr><td colspan="4" class="py-10 text-center text-gray-400 italic">Sinkronisasi Database...</td></tr>';
            
            fetch(scriptURL)
                .then(res => res.json())
                .then(data => {
                    databaseBody.innerHTML = '';
                    // Urutkan dari yang terbaru (paling bawah di sheet jadi paling atas di web)
                    data.reverse().forEach(item => {
                        const row = `
                            <tr class="hover:bg-gray-50 transition">
                                <td class="p-3 text-gray-500 whitespace-nowrap">${item.tanggal.substring(5,10)}</td>
                                <td class="p-3">
                                    <span class="px-2 py-0.5 rounded bg-gray-100 text-[9px] font-bold text-gray-400">${item.kategori}</span>
                                </td>
                                <td class="p-3 font-medium text-gray-700 truncate max-w-[80px]">${item.keterangan}</td>
                                <td class="p-3 text-right font-bold text-red-600 whitespace-nowrap">
                                    ${Number(item.jumlah).toLocaleString('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 })}
                                </td>
                            </tr>
                        `;
                        databaseBody.insertAdjacentHTML('beforeend', row);
                    });
                    totalDataText.innerText = `${data.length} Baris Data Tersimpan`;
                })
                .catch(err => {
                    databaseBody.innerHTML = '<tr><td colspan="4" class="py-10 text-center text-red-400 text-[10px] font-bold">Koneksi Database Gagal. Pastikan Apps Script sudah di-Deploy ulang.</td></tr>';
                });
        }

        // FUNGSI SIMPAN (POST)
        form.addEventListener('submit', e => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerText = 'Menyimpan...';
            statusText.classList.remove('hidden', 'text-green-600', 'text-red-600');
            statusText.innerText = 'Mengirim ke Sheets...';

            const formData = {
                tanggal: document.getElementById('tanggal').value,
                kategori: document.querySelector('input[name="kategori"]:checked').value,
                keterangan: document.getElementById('keterangan').value,
                jumlah: "-" + document.getElementById('jumlah').value
            };

            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(formData)})
            .then(() => {
                statusText.innerText = "✅ Database Berhasil Diperbarui!";
                statusText.classList.add("text-green-600", "block");
                form.reset();
                document.getElementById('tanggal').valueAsDate = new Date();
                submitBtn.disabled = false;
                submitBtn.innerText = 'Simpan Pengeluaran';
                loadDatabase(); // Refresh tabel setelah input
                setTimeout(() => { statusText.classList.add('hidden'); }, 3000);
            })
            .catch(() => {
                statusText.innerText = "❌ Gagal Menghubungi Database.";
                statusText.classList.add("text-red-600", "block");
                submitBtn.disabled = false;
            });
        });

        // Panggil database saat pertama kali load
        loadDatabase();
    </script>
</body>
</html>
